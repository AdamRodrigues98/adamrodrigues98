<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" role="img" aria-label="Banco de dados com gravações em andamento" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>database</title>
<style>:root{--line:#8c959f;--ink:#57606a;--q:#0969da;--ok:#1a7f37;--warn:#bf8700;--body:#f6f8fa;--band:#d0d7de;--grid:#d8dee4}
@media (prefers-color-scheme:dark){:root{--line:#6e7681;--ink:#8b949e;--q:#58a6ff;--ok:#3fb950;--warn:#d29922;--body:#161b22;--band:#30363d;--grid:#30363d}}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:var(--ink)}
.cyl{fill:var(--body);stroke:var(--ink);stroke-width:2}
.band{fill:var(--band);animation:io 2.4s ease-in-out infinite}.b2{animation-delay:.8s}.b3{animation-delay:1.6s}
@keyframes io{0%,100%{fill:var(--band)}15%{fill:var(--q)}45%{fill:var(--band)}}
.led{fill:var(--ok);animation:led 1.2s step-end infinite}
@keyframes led{0%,60%{opacity:1}61%,100%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.band,.led{animation:none}}
</style>
<path class="cyl" d="M88 42 v196 a92 26 0 0 0 184 0 v-196"/>
<path class="band" d="M88 86 a92 26 0 0 0 184 0 v22 a92 26 0 0 1 -184 0z"/><path class="band b2" d="M88 142 a92 26 0 0 0 184 0 v22 a92 26 0 0 1 -184 0z"/><path class="band b3" d="M88 198 a92 26 0 0 0 184 0 v22 a92 26 0 0 1 -184 0z"/>
<ellipse class="cyl" cx="180" cy="42" rx="92" ry="26"/>
<circle class="led" cx="238" cy="68" r="5"/>
<text x="180" y="296" text-anchor="middle" style="font-size:16px">database</text>
</svg>
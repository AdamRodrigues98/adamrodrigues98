<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="240" viewBox="0 0 1120 240" role="img" aria-label="Cloud com observabilidade: um pico de latência gera alerta, RCA e automação, que corrige o ambiente" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Cloud + SRE: observabilidade, RCA e automação</title>
<style>
  :root{--line:#8c959f;--ink:#57606a;--q:#0969da;--ok:#1a7f37;--warn:#bf8700;--body:#f6f8fa;--grid:#d8dee4}
  @media (prefers-color-scheme:dark){:root{--line:#6e7681;--ink:#8b949e;--q:#58a6ff;--ok:#3fb950;--warn:#d29922;--body:#161b22;--grid:#30363d}}
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:12px;fill:var(--ink)}
  .sm{font-size:11px}
  .wire{fill:none;stroke:var(--line);stroke-width:1.3;stroke-dasharray:3 4}
  .head{fill:var(--line)}
  .box{fill:var(--body);stroke:var(--line);stroke-width:1.2}
  .cloud{fill:var(--body);stroke:var(--ink);stroke-width:1.6}
  .grid{stroke:var(--grid);stroke-width:1}
  .q{fill:var(--q)}.ok{fill:var(--ok)}.warn{fill:var(--warn)}
  .chart{fill:none;stroke:var(--q);stroke-width:1.8;stroke-linejoin:round;animation:scroll 6s linear infinite}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-210px)}}
  .led{fill:var(--ok);animation:led 1.4s step-end infinite}.d1{animation-delay:.45s}.d2{animation-delay:.9s}
  @keyframes led{0%,60%{opacity:1}61%,100%{opacity:.3}}
  .rds{fill:var(--ok);animation:rds 6s step-end infinite}
  @keyframes rds{0%,19%{fill:var(--ok)}20%,79%{fill:var(--warn)}80%,100%{fill:var(--ok)}}
  .s-alert{animation:hot 6s ease-out infinite}
  .s-rca{animation:hot2 6s ease-out infinite}
  .s-auto{animation:fix 6s ease-out infinite}
  @keyframes hot{0%,19%,40%,100%{stroke:var(--line)}22%,34%{stroke:var(--warn);stroke-width:2}}
  @keyframes hot2{0%,44%,62%,100%{stroke:var(--line)}47%,58%{stroke:var(--warn);stroke-width:2}}
  @keyframes fix{0%,69%,90%,100%{stroke:var(--line)}72%,85%{stroke:var(--ok);stroke-width:2}}
  .budget{fill:var(--ok);transform-box:fill-box;transform-origin:left;animation:budget 6s ease-in-out infinite}
  @keyframes budget{0%,20%{transform:scaleX(1);fill:var(--ok)}40%,70%{transform:scaleX(.72);fill:var(--warn)}92%,100%{transform:scaleX(1);fill:var(--ok)}}
  @media (prefers-reduced-motion:reduce){.chart,.led,.rds,.s-alert,.s-rca,.s-auto,.budget{animation:none}}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10z"/></marker>
  <clipPath id="plot"><rect x="415" y="68" width="210" height="72"/></clipPath>
</defs>

<!-- fios -->
<path id="m" class="wire" d="M318 112 L392 112" marker-end="url(#arrow)"/>
<path id="a" class="wire" d="M648 112 L692 112" marker-end="url(#arrow)"/>
<path id="b" class="wire" d="M800 112 L842 112" marker-end="url(#arrow)"/>
<path id="c" class="wire" d="M950 112 L982 112" marker-end="url(#arrow)"/>
<path id="loop" class="wire" d="M1045 128 C1045 222, 1000 222, 900 222 L 300 222 C 200 222, 170 215, 170 186" marker-end="url(#arrow)"/>
<text class="sm" x="560" y="215" text-anchor="middle">auto-remediação</text>

<!-- cloud -->
<path class="cloud" d="M70 180 C30 180 25 125 68 118 C62 70 120 52 150 80 C170 40 250 42 262 95 C305 92 318 130 300 160 C295 175 285 180 270 180 Z"/>
<text x="170" y="112" text-anchor="middle">aws</text>
<g>
  <rect class="box" x="82" y="128" width="54" height="30" rx="5"/><text class="sm" x="105" y="147" text-anchor="middle">eks</text><circle class="led" cx="128" cy="136" r="2.6"/>
  <rect class="box" x="143" y="128" width="54" height="30" rx="5"/><text class="sm" x="166" y="147" text-anchor="middle">rds</text><circle class="rds" cx="189" cy="136" r="2.6"/>
  <rect class="box" x="204" y="128" width="54" height="30" rx="5"/><text class="sm" x="227" y="147" text-anchor="middle">s3</text><circle class="led d2" cx="250" cy="136" r="2.6"/>
</g>

<!-- observabilidade -->
<rect class="box" x="400" y="38" width="240" height="148" rx="8"/>
<text class="sm" x="415" y="58">p99 latency</text>
<text class="sm" x="625" y="58" text-anchor="end">SLO 99.95%</text>
<line class="grid" x1="415" y1="90" x2="625" y2="90"/><line class="grid" x1="415" y1="115" x2="625" y2="115"/><line class="grid" x1="415" y1="140" x2="625" y2="140"/>
<g clip-path="url(#plot)"><polyline class="chart" points="415,115.9 425,113.8 435,119.8 445,112.9 455,118.4 465,116.4 475,112.7 485,118.1 495,112.4 505,117.2 515,112.8 525,113.1 535,117.1 545,121.9 555,113.5 565,114.7 575,119.5 585,123.4 595,112.0 605,84.0 615,114.0 625,112.6 625,115.9 635,113.8 645,119.8 655,112.9 665,118.4 675,116.4 685,112.7 695,118.1 705,112.4 715,117.2 725,112.8 735,113.1 745,117.1 755,121.9 765,113.5 775,114.7 785,119.5 795,123.4 805,112.0 815,84.0 825,114.0 835,112.6 835,115.9 845,113.8 855,119.8 865,112.9 875,118.4 885,116.4 895,112.7 905,118.1 915,112.4 925,117.2 935,112.8 945,113.1 955,117.1 965,121.9 975,113.5 985,114.7 995,119.5 1005,123.4 1015,112.0 1025,84.0 1035,114.0 1045,112.6"/></g>
<text class="sm" x="415" y="160">error budget</text>
<rect x="415" y="166" width="210" height="7" rx="3.5" fill="var(--grid)"/>
<rect class="budget" x="415" y="166" width="210" height="7" rx="3.5"/>

<!-- incidente -->
<rect class="box s-alert" x="700" y="98" width="100" height="28" rx="6"/><text x="750" y="116" text-anchor="middle">alerta</text>
<rect class="box s-rca" x="850" y="98" width="100" height="28" rx="6"/><text x="900" y="116" text-anchor="middle">RCA</text>
<rect class="box s-auto" x="990" y="98" width="110" height="28" rx="6"/><text x="1045" y="116" text-anchor="middle">automação</text>

<!-- métricas contínuas -->
<circle class="q" r="4" visibility="hidden"><set attributeName="visibility" to="visible" begin="0s"/><animateMotion dur="1.5s" repeatCount="indefinite"><mpath href="#m"/></animateMotion></circle>
<circle class="q" r="3" visibility="hidden"><set attributeName="visibility" to="visible" begin=".75s"/><animateMotion dur="1.5s" begin=".75s" repeatCount="indefinite"><mpath href="#m"/></animateMotion></circle>

<!-- ciclo do incidente -->
<circle class="warn" r="4" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.133;0.217;1"/><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.133;0.217;1"><mpath href="#a"/></animateMotion></circle>
<circle class="warn" r="4" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.350;0.450;1"/><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.350;0.450;1"><mpath href="#b"/></animateMotion></circle>
<circle class="ok" r="4" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.600;0.683;1"/><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.600;0.683;1"><mpath href="#c"/></animateMotion></circle>
<circle class="ok" r="4" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.733;0.950;1"/><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.733;0.950;1"><mpath href="#loop"/></animateMotion></circle>
</svg>
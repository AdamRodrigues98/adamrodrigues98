<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" role="img" aria-label="Painel de latência p99 com SLO de 99.95% e error budget" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>p99 latency</title>
<style>:root{--line:#8c959f;--ink:#57606a;--q:#0969da;--ok:#1a7f37;--warn:#bf8700;--body:#f6f8fa;--band:#d0d7de;--grid:#d8dee4}
@media (prefers-color-scheme:dark){:root{--line:#6e7681;--ink:#8b949e;--q:#58a6ff;--ok:#3fb950;--warn:#d29922;--body:#161b22;--band:#30363d;--grid:#30363d}}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:var(--ink)}
.panel{fill:var(--body);stroke:var(--line);stroke-width:1.6}
.grid{stroke:var(--grid);stroke-width:1.2}
.chart{fill:none;stroke:var(--q);stroke-width:2.6;stroke-linejoin:round;animation:scroll 6s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-280px)}}
.budget{fill:var(--ok);transform-box:fill-box;transform-origin:left;animation:budget 6s ease-in-out infinite}
@keyframes budget{0%,20%{transform:scaleX(1);fill:var(--ok)}40%,65%{transform:scaleX(.72);fill:var(--warn)}90%,100%{transform:scaleX(1);fill:var(--ok)}}
@media (prefers-reduced-motion:reduce){.chart,.budget{animation:none}}
</style>
<defs><clipPath id="plot"><rect x="34" y="90" width="292" height="102"/></clipPath></defs>
<rect class="panel" x="12" y="28" width="336" height="244" rx="12"/>
<text x="34" y="62" style="font-size:16px">p99 latency</text>
<text x="326" y="62" text-anchor="end" style="font-size:16px">SLO 99.95%</text>
<line class="grid" x1="34" y1="98" x2="326" y2="98"/>
<line class="grid" x1="34" y1="141.0" x2="326" y2="141.0"/>
<line class="grid" x1="34" y1="184" x2="326" y2="184"/>
<g clip-path="url(#plot)"><polyline class="chart" points="34,148.5 48,146.1 62,153.1 76,145.0 90,151.5 104,149.1 118,144.8 132,151.1 146,144.5 160,150.1 174,145.0 188,145.3 202,149.9 216,155.6 230,145.7 244,147.1 258,147.0 272,104.0 286,149.0 300,149.6 314,148.5 314,148.5 328,146.1 342,153.1 356,145.0 370,151.5 384,149.1 398,144.8 412,151.1 426,144.5 440,150.1 454,145.0 468,145.3 482,149.9 496,155.6 510,145.7 524,147.1 538,147.0 552,104.0 566,149.0 580,149.6 594,148.5 594,148.5 608,146.1 622,153.1 636,145.0 650,151.5 664,149.1 678,144.8 692,151.1 706,144.5 720,150.1 734,145.0 748,145.3 762,149.9 776,155.6 790,145.7 804,147.1 818,147.0 832,104.0 846,149.0 860,149.6 874,148.5"/></g>
<text x="34" y="232" style="font-size:16px">error budget</text>
<rect x="34" y="244" width="292" height="11" rx="5.5" fill="var(--grid)"/>
<rect class="budget" x="34" y="244" width="292" height="11" rx="5.5"/>
</svg>
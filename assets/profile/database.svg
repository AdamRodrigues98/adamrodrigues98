<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="240" viewBox="0 0 1120 240" role="img" aria-label="App grava no primary, que replica para réplicas; Databricks grava no Delta Lake e Trino com Airflow alimentam o lakehouse Iceberg no S3" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Fluxo de dados: app, primary, réplicas e ferramentas analíticas</title>
<style>
  :root{--line:#8c959f;--ink:#57606a;--q:#0969da;--rep:#1a7f37;--an:#8250df;--body:#f6f8fa;--band:#d0d7de}
  @media (prefers-color-scheme:dark){:root{--line:#6e7681;--ink:#8b949e;--q:#58a6ff;--rep:#3fb950;--an:#a371f7;--body:#161b22;--band:#30363d}}
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:12px;fill:var(--ink)}
  .wire{fill:none;stroke:var(--line);stroke-width:1.3;stroke-dasharray:3 4}
  .head{fill:var(--line)}
  .box{fill:var(--body);stroke:var(--line);stroke-width:1.2}
  .cyl{fill:var(--body);stroke:var(--ink);stroke-width:1.6}
  .q{fill:var(--q)}.r{fill:var(--rep)}.a{fill:var(--an)}
  .band{fill:var(--band);animation:wr 2s ease-in-out infinite}.b2{animation-delay:.66s}.b3{animation-delay:1.33s}
  @keyframes wr{0%,100%{fill:var(--band)}15%{fill:var(--q)}40%{fill:var(--band)}}
  .rb{fill:var(--band);animation:rp 1.8s ease-in-out infinite}.rb2{animation-delay:.9s}
  @keyframes rp{0%,100%{fill:var(--band)}15%{fill:var(--rep)}40%{fill:var(--band)}}
  .led{fill:var(--rep);animation:led 1.2s step-end infinite}
  @keyframes led{0%,60%{opacity:1}61%,100%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.band,.rb,.led{animation:none}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10z"/></marker></defs>
<path id="w" class="wire" d="M1000 130.0 L915 130.0" marker-end="url(#arrow)"/><path id="r1" class="wire" d="M795 130.0 C 740 130.0, 710 63.0, 648 63.0" marker-end="url(#arrow)"/><path id="r2" class="wire" d="M795 130.0 C 740 130.0, 710 165.0, 648 165.0" marker-end="url(#arrow)"/><path id="a1" class="wire" d="M562 63.0 C 520 63.0, 500 62, 470 62" marker-end="url(#arrow)"/><path id="a2" class="wire" d="M562 165.0 C 520 165.0, 500 186, 470 186" marker-end="url(#arrow)"/><path id="d1" class="wire" d="M320 62 L210 62" marker-end="url(#arrow)"/><path id="t3" class="wire" d="M320 186 L210 186" marker-end="url(#arrow)"/>

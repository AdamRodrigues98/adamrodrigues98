<text x="600" y="218" text-anchor="middle">replica-2</text>
<path class="cyl" d="M795 58 v136 a55 16 0 0 0 110 0 v-136"/><path class="band" d="M795 88 a55 16 0 0 0 110 0 v14 a55 16 0 0 1 -110 0z"/><path class="band b2" d="M795 126 a55 16 0 0 0 110 0 v14 a55 16 0 0 1 -110 0z"/><path class="band b3" d="M795 164 a55 16 0 0 0 110 0 v14 a55 16 0 0 1 -110 0z"/><ellipse class="cyl" cx="850" cy="58" rx="55" ry="16"/>

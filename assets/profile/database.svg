<rect class="box" x="320" y="172" width="140" height="28" rx="6"/><text x="390" y="190" text-anchor="middle">trino + airflow</text>
<rect class="box" x="40" y="48" width="160" height="28" rx="6"/><text x="120" y="66" text-anchor="middle">delta lake</text>

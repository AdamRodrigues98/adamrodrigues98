<svg xmlns="http://www.w3.org/2000/svg" width="944" height="505" viewBox="0 0 944 505" role="img" aria-label="Sobre Adam Rodrigues: Database Reliability Engineer Sr." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Sobre mim</title><style>text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:15px;white-space:pre}
.n{fill:#b8c0c8}.b{fill:#ffffff;font-weight:700}.bullet{fill:#3fb950;font-weight:700}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cur{animation:blink 1.1s step-end infinite}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}</style>
<rect x="0" y="0" width="944" height="505" rx="12" fill="#000"/>
<text x="40" y="64" xml:space="preserve" textLength="810.0" lengthAdjust="spacing"><tspan class="n">Com mais de </tspan><tspan class="b">8 anos</tspan><tspan class="n"> em ambientes críticos de alta disponibilidade e grande volume. Atuo com</tspan></text>
<text x="40" y="88" xml:space="preserve" textLength="819.0" lengthAdjust="spacing"><tspan class="b">PostgreSQL, MySQL, SQL Server e MongoDB na AWS</tspan><tspan class="n">, unindo performance tuning, práticas de </tspan><tspan class="b">DBRE</tspan></text>
<text x="40" y="112" xml:space="preserve" textLength="855.0" lengthAdjust="spacing"><tspan class="n">(observabilidade, RCA e capacity planning) e plataformas analíticas com </tspan><tspan class="b">Python, Airflow, Trino,</tspan></text>
<text x="40" y="136" xml:space="preserve" textLength="135.0" lengthAdjust="spacing"><tspan class="b">Iceberg e Hive</tspan><tspan class="n">.</tspan></text>
<text x="40" y="174.4" xml:space="preserve" textLength="864.0" lengthAdjust="spacing"><tspan class="bullet">› </tspan><tspan class="b">Atualmente:</tspan><tspan class="n"> Database Reliability Engineer Sr. na </tspan><tspan class="b">Nexti</tspan><tspan class="n"> — tuning de queries/índices/parâmetros,</tspan></text>
<text x="40" y="198.4" xml:space="preserve" textLength="846.0" lengthAdjust="spacing"><tspan class="bullet">  </tspan><tspan class="n">resposta a incidentes e War Rooms, automação de ETL/ELT e arquiteturas Data Lake / Lakehouse</tspan></text>
<text x="40" y="222.4" xml:space="preserve" textLength="252.0" lengthAdjust="spacing"><tspan class="bullet">  </tspan><tspan class="n">que reduzem carga no OLTP.</tspan></text>
<text x="40" y="260.8" xml:space="preserve" textLength="837.0" lengthAdjust="spacing"><tspan class="bullet">› </tspan><tspan class="b">Trabalhando em:</tspan><tspan class="n"> Projetos de médio e longo prazo, com duração de alguns meses a vários anos.</tspan></text>
<text x="40" y="284.8" xml:space="preserve" textLength="864.0" lengthAdjust="spacing"><tspan class="bullet">  </tspan><tspan class="n">Iniciativas maiores são estruturadas em etapas e incorporadas ao roadmap, envolvendo separação</tspan></text>
<text x="40" y="308.8" xml:space="preserve" textLength="801.0" lengthAdjust="spacing"><tspan class="bullet">  </tspan><tspan class="n">de bases, expurgo e particionamento de grandes tabelas, replicação e migração de dados,</tspan></text>
<text x="40" y="332.8" xml:space="preserve" textLength="576.0" lengthAdjust="spacing"><tspan class="bullet">  </tspan><tspan class="n">desnormalização e construção de arquiteturas de DW e Lakehouse</tspan></text>
<text x="40" y="371.2" xml:space="preserve" textLength="801.0" lengthAdjust="spacing"><tspan class="bullet">› </tspan><tspan class="b">Aprendendo:</tspan><tspan class="n"> Terraform e GitOps para automação de infraestrutura, além de ferramentas de</tspan></text>
<text x="40" y="395.2" xml:space="preserve" textLength="630.0" lengthAdjust="spacing"><tspan class="bullet">  </tspan><tspan class="n">Engenharia de Dados para movimentação e migração de grandes volumes.</tspan></text>
<text x="40" y="433.59999999999997" xml:space="preserve" textLength="855.0" lengthAdjust="spacing"><tspan class="bullet">› </tspan><tspan class="b">Fale comigo sobre:</tspan><tspan class="n"> Bancos de dados, SQL, MySQL, PostgreSQL, SQL Server, Cloud e Engenharia de</tspan></text>
<text x="40" y="457.59999999999997" xml:space="preserve" textLength="72.0" lengthAdjust="spacing"><tspan class="bullet">  </tspan><tspan class="n">Dados.</tspan></text>
<rect class="cur" x="114.7" y="443.59999999999997" width="8.0" height="18" fill="#3fb950"/>
</svg>
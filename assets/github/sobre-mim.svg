<svg xmlns="http://www.w3.org/2000/svg" width="1716" height="329" viewBox="0 0 1716 329" role="img" aria-label="Sobre Adam Rodrigues: Database Reliability Engineer Sr." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Sobre mim</title><style>text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:15px;white-space:pre}
.n{fill:#b8c0c8}.b{fill:#ffffff;font-weight:700}.bullet{fill:#3fb950;font-weight:700}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cur{animation:blink 1.1s step-end infinite}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}</style>
<rect x="0" y="0" width="1716" height="329" rx="12" fill="#000"/>
<text x="48" y="60" xml:space="preserve" textLength="1593.0" lengthAdjust="spacing"><tspan class="n">Com mais de </tspan><tspan class="b">8 anos</tspan><tspan class="n"> em ambientes críticos de alta disponibilidade e grande volume. Atuo com </tspan><tspan class="b">PostgreSQL, MySQL, SQL Server e MongoDB na AWS</tspan><tspan class="n">, unindo performance tuning, práticas de</tspan></text>
<text x="48" y="84" xml:space="preserve" textLength="1044.0" lengthAdjust="spacing"><tspan class="b">DBRE</tspan><tspan class="n"> (observabilidade, RCA e capacity planning) e plataformas analíticas com </tspan><tspan class="b">Python, Airflow, Trino, Iceberg e Hive</tspan><tspan class="n">.</tspan></text>
<text x="48" y="122.4" xml:space="preserve" textLength="1611.0" lengthAdjust="spacing"><tspan class="bullet">› </tspan><tspan class="b">Atualmente:</tspan><tspan class="n"> Database Reliability Engineer Sr. na </tspan><tspan class="b">Nexti</tspan><tspan class="n"> — tuning de queries/índices/parâmetros, resposta a incidentes e War Rooms, automação de ETL/ELT e arquiteturas Data Lake /</tspan></text>
<text x="48" y="146.4" xml:space="preserve" textLength="342.0" lengthAdjust="spacing"><tspan class="bullet">  </tspan><tspan class="n">Lakehouse que reduzem carga no OLTP.</tspan></text>
<text x="48" y="184.8" xml:space="preserve" textLength="1602.0" lengthAdjust="spacing"><tspan class="bullet">› </tspan><tspan class="b">Trabalhando em:</tspan><tspan class="n"> Projetos de médio e longo prazo, com duração de alguns meses a vários anos. Iniciativas maiores são estruturadas em etapas e incorporadas ao roadmap, envolvendo</tspan></text>
<text x="48" y="208.8" xml:space="preserve" textLength="1458.0" lengthAdjust="spacing"><tspan class="bullet">  </tspan><tspan class="n">separação de bases, expurgo e particionamento de grandes tabelas, replicação e migração de dados, desnormalização e construção de arquiteturas de DW e Lakehouse</tspan></text>
<text x="48" y="247.20000000000002" xml:space="preserve" textLength="1422.0" lengthAdjust="spacing"><tspan class="bullet">› </tspan><tspan class="b">Aprendendo:</tspan><tspan class="n"> Terraform e GitOps para automação de infraestrutura, além de ferramentas de Engenharia de Dados para movimentação e migração de grandes volumes.</tspan></text>
<text x="48" y="285.6" xml:space="preserve" textLength="918.0" lengthAdjust="spacing"><tspan class="bullet">› </tspan><tspan class="b">Fale comigo sobre:</tspan><tspan class="n"> Bancos de dados, SQL, MySQL, PostgreSQL, SQL Server, Cloud e Engenharia de Dados.</tspan></text>
<rect class="cur" x="968.7" y="271.6" width="8.0" height="18" fill="#3fb950"/>
</svg>
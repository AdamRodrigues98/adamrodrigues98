      .base { stroke: #484f58; }
      .refline { stroke: #8b949e; }
      .hl { fill: #3b2e1a; }
      .hlbox { fill: #3b2e1a; stroke: #d29922; }
    }
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.6s ease-out forwards; }
    .fade { opacity: 0; animation: fade 1.2s ease-out 1.4s forwards; }
    .fadein { opacity: 0; animation: fade .6s ease-out forwards; }
    .growy { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); animation: growy .6s ease-out forwards; }
    .growx { transform-box: fill-box; transform-origin: 0% 50%; transform: scaleX(0); animation: growx .8s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes growy { to { transform: scaleY(1); } }
    @keyframes growx { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .draw { animation: none; stroke-dashoffset: 0; }
      .fade, .fadein { animation: none; opacity: 1; }
      .growy, .growx { animation: none; transform: none; }
    }

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800" role="img" aria-label="Top hosts (25)">
<style>
    .card { fill: #ffffff; stroke: #d0d7de; }
    .title { font: 600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #16191f; }
    .subtitle { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #5f6b7a; }
    .axis { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #5f6b7a; }
    .legend { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #16191f; }
    .grid { stroke: #e9ebed; stroke-width: 1; }
    .base { stroke: #8d99a8; stroke-width: 1; }
    .limit { font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .hdr { font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #16191f; }
    .cell { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #16191f; }
    .sql { font: 400 11.5px SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; fill: #16191f; }
    .val { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #16191f; }
    .tag { font: 600 10.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; }
    .row { stroke: #e9ebed; }
    .refline { stroke: #5f6b7a; }
    .hl { fill: #fff4e5; }
    .hlbox { fill: #fff4e5; stroke: #f0b35a; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .title, .legend, .hdr, .cell, .sql, .val { fill: #e6edf3; }
      .subtitle, .axis { fill: #8b949e; }
      .grid, .row { stroke: #21262d; }
      .base { stroke: #484f58; }
      .refline { stroke: #8b949e; }
      .hl { fill: #3b2e1a; }
      .hlbox { fill: #3b2e1a; stroke: #d29922; }
    }
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.6s ease-out forwards; }
    .fade { opacity: 0; animation: fade 1.2s ease-out 1.4s forwards; }
    .fadein { opacity: 0; animation: fade .6s ease-out forwards; }
    .growy { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); animation: growy .6s ease-out forwards; }
    .growx { transform-box: fill-box; transform-origin: 0% 50%; transform: scaleX(0); animation: growx .8s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes growy { to { transform: scaleY(1); } }
    @keyframes growx { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .draw { animation: none; stroke-dashoffset: 0; }
      .fade, .fadein { animation: none; opacity: 1; }
      .growy, .growx { animation: none; transform: none; }
    }
</style>

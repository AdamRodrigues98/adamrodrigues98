<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,Helvetica,Arial,sans-serif" role="img" aria-label="Uso do primário na hora mais carregada: 5.580 de 30.000 IOPS e 85,3 de 2.000 MB/s">
<title>Uso do primário na hora mais carregada: 5.580 de 30.000 IOPS e 85,3 de 2.000 MB/s</title>
<style>
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 9s cubic-bezier(.2,.7,.2,1) infinite both}
@keyframes grow{0%{transform:scaleY(0);opacity:1}10%,92%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.growx{transform-box:fill-box;transform-origin:left;animation:growx 9s cubic-bezier(.2,.7,.2,1) infinite both}
@keyframes growx{0%{transform:scaleX(0);opacity:1}12%,92%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
.fade{animation:fade 9s ease-out infinite both}
@keyframes fade{0%,12%{opacity:0}22%,92%{opacity:1}100%{opacity:0}}
.draw{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:draw 9s ease-out infinite both}
@keyframes draw{0%{stroke-dashoffset:var(--l);opacity:1}40%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.5)}}
</style>
<defs></defs>
<rect width="1000" height="250" fill="#fcfcfb"/>
<text x="24.0" y="34.0" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="650" >O que o primário usa do que contrata</text>
<text x="24.0" y="54.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400" >Na hora mais carregada do período medido, depois da troca para gp3</text>
<text x="24.0" y="92.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="600" >Operações por segundo</text>
<rect x="24" y="100" width="820" height="26" rx="4" fill="#ecebe6"/>
<rect x="24" y="100" width="152.5" height="26" rx="4" fill="#2a78d6" class="growx" style="animation-delay:0.0s"/>
<text x="186.5" y="118.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" class="fade" style="animation-delay:0.3s">5.580 de 30.000 IOPS</text>
<text x="976.0" y="119.0" font-size="18" fill="#0b0b0b" text-anchor="end" font-weight="700" >18,6%</text>
<text x="24.0" y="156.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="600" >Vazão</text>
<rect x="24" y="164" width="820" height="26" rx="4" fill="#ecebe6"/>
<rect x="24" y="164" width="35.0" height="26" rx="4" fill="#2a78d6" class="growx" style="animation-delay:0.2s"/>
<text x="69.0" y="182.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" class="fade" style="animation-delay:0.5s">85,3 de 2.000 MB/s</text>
<text x="976.0" y="183.0" font-size="18" fill="#0b0b0b" text-anchor="end" font-weight="700" >4,3%</text>
<text x="24.0" y="232.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >Sobra contratada: reduzir o primário para 15.000 IOPS ainda deixaria 2,7 vezes de folga sobre o pico de operações.</text>
</svg>

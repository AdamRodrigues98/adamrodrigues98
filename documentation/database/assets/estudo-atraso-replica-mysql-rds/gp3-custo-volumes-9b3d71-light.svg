.draw{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:draw 9s ease-out infinite both}
@keyframes draw{0%{stroke-dashoffset:var(--l);opacity:1}40%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.5)}}

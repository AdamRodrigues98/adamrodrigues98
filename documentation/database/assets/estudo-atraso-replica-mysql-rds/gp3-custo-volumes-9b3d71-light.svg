<title>Primário e réplica somados, preço de tabela: US$ 4.120,00, US$ 3.305,00 e cenário de US$ 2.625,00</title>
<style>
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 9s cubic-bezier(.2,.7,.2,1) infinite both}
@keyframes grow{0%{transform:scaleY(0);opacity:1}10%,92%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.growx{transform-box:fill-box;transform-origin:left;animation:growx 9s cubic-bezier(.2,.7,.2,1) infinite both}
@keyframes growx{0%{transform:scaleX(0);opacity:1}12%,92%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
.fade{animation:fade 9s ease-out infinite both}

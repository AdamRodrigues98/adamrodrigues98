<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1072" viewBox="0 0 900 1072"><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#e6edf3}
.muted{fill:#8b949e}
.title{font-size:20px;font-weight:700}
.axis{font-size:13px;fill:#b1bac4}
.legend{font-size:14px;fill:#e6edf3}
.grid{stroke:#21262d;stroke-width:1}
.fade{opacity:0;animation:fade .6s ease-out forwards}
@keyframes fade{to{opacity:1}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.grow{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:grow .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleY(1)}}
.growx{transform-box:fill-box;transform-origin:0% 50%;transform:scaleX(0);animation:growx .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes growx{to{transform:scaleX(1)}}
.row{opacity:0;animation:rowin .5s ease-out forwards}
@keyframes rowin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

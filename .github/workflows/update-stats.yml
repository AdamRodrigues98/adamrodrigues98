name: Atualizar estatísticas do GitHub

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Gerar estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=AdamRodrigues98&show_icons=true&count_private=true&theme=darcula&hide_border=true&hide=issues,contribs&bg_color=00000000
          path: assets/github/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=AdamRodrigues98&layout=compact&hide_border=true&theme=darcula&bg_color=00000000&langs_count=6&hide=jupyter%20notebook,tex,css,php
          path: assets/github/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar sequência de contribuições
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=AdamRodrigues98&theme=darcula&disable_animations=true
          path: assets/github/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar gráfico de atividade
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: AdamRodrigues98
          options: bg_color=100f0f&color=a0a0a0&line=ffbf00&point=403e41&area=true&hide_border=true
          output_path: assets/github/activity.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit das estatísticas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github/*.svg

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas estatísticas."
            exit 0
          fi

          git commit -m "Atualiza estatísticas do GitHub"
          git push